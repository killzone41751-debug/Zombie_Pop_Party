<!DOCTYPE HTML>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zombie Pop Party</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
  background: linear-gradient(135deg, #17152e, #34205b, #102c35);
  overflow-x: hidden;
}

header {
  padding: 22px 10px 10px;
}

h1 {
  color: #aaff42;
  font-size: 34px;
  text-shadow: 0 0 15px #79ff32;
  margin: 8px 0;
}

.subtitle {
  color: #ffd84a;
  font-size: 15px;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 18px auto;
}

.stat {
  background: #ffffff18;
  border: 2px solid #aaff42;
  border-radius: 12px;
  padding: 12px 18px;
  min-width: 95px;
}

.stat strong {
  display: block;
  color: #aaff42;
  font-size: 25px;
}

.stat span {
  font-size: 12px;
}

#game {
  width: min(92vw, 440px);
  height: 390px;
  margin: 15px auto;
  padding: 12px;
  background: #080d20;
  border: 3px solid #aaff42;
  border-radius: 20px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 10px;
  box-shadow: 0 0 22px #aaff4260;
}

.hole {
  background: radial-gradient(circle, #292342, #101426);
  border: 2px solid #49436b;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 54px;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.hole.zombie {
  background: radial-gradient(circle, #527a36, #192c24);
  border-color: #aaff42;
  animation: pop .15s ease-out;
}

@keyframes pop {
  from { transform: scale(.6); }
  to { transform: scale(1); }
}

button {
  border: none;
  border-radius: 14px;
  padding: 16px 30px;
  background: #aaff42;
  color: #18220b;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
  margin: 12px;
}

button:active {
  transform: scale(.96);
}

#message {
  min-height: 35px;
  font-size: 18px;
  color: #ffd84a;
  padding: 8px;
}

footer {
  padding: 15px;
  color: #c9c4e0;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>🧟 ZOMBIE POP PARTY 🎉</h1>
  <div class="subtitle">THE ZOMBIES ARE COMING! POP THEM!</div>
</header>

<div class="stats">
  <div class="stat">
    <strong id="score">0</strong>
    <span>SCORE</span>
  </div>
  <div class="stat">
    <strong id="time">30</strong>
    <span>SECONDS</span>
  </div>
  <div class="stat">
    <strong id="best">0</strong>
    <span>BEST</span>
  </div>
</div>

<div id="message">Ready to party?</div>

<div id="game">
  <div class="hole" data-id="0">💀</div>
  <div class="hole" data-id="1">💀</div>
  <div class="hole" data-id="2">💀</div>
  <div class="hole" data-id="3">💀</div>
  <div class="hole" data-id="4">💀</div>
  <div class="hole" data-id="5">💀</div>
  <div class="hole" data-id="6">💀</div>
  <div class="hole" data-id="7">💀</div>
  <div class="hole" data-id="8">💀</div>
</div>

<button id="start">START GAME</button>

<footer>
  🧟 Tap the zombies before they disappear!<br>
  Zombie Pop Party © 2026
</footer>

<script>
const holes = [...document.querySelectorAll(".hole")];
const scoreDisplay = document.getElementById("score");
const timeDisplay = document.getElementById("time");
const bestDisplay = document.getElementById("best");
const message = document.getElementById("message");
const startButton = document.getElementById("start");

let score = 0;
let time = 30;
let active = -1;
let playing = false;
let timer;
let popTimer;
let best = Number(localStorage.getItem("zombieBest") || 0);

bestDisplay.textContent = best;

function clearZombies() {
  holes.forEach(hole => {
    hole.classList.remove("zombie");
    hole.textContent = "💀";
  });
  active = -1;
}

function popZombie() {
  clearZombies();

  let next = Math.floor(Math.random() * holes.length);
  active = next;

  const zombie = holes[next];
  zombie.classList.add("zombie");
  zombie.textContent = ["🧟", "🧟‍♂️", "🧟‍♀️"][
    Math.floor(Math.random() * 3)
  ];
}

function startGame() {
  clearInterval(timer);
  clearInterval(popTimer);

  score = 0;
  time = 30;
  playing = true;

  scoreDisplay.textContent = score;
  timeDisplay.textContent = time;
  message.textContent = "POP THOSE ZOMBIES!";
  startButton.textContent = "PLAYING...";

  popZombie();

  popTimer = setInterval(popZombie, 850);

  timer = setInterval(() => {
    time--;
    timeDisplay.textContent = time;

    if (time <= 0) {
      endGame();
    }
  }, 1000);
}

function endGame() {
  playing = false;
  clearInterval(timer);
  clearInterval(popTimer);
  clearZombies();

  if (score > best) {
    best = score;
    localStorage.setItem("zombieBest", best);
    bestDisplay.textContent = best;
    message.textContent = "🏆 NEW HIGH SCORE! " + score + " POINTS!";
  } else {
    message.textContent = "🎉 GAME OVER! YOU SCORED " + score + "!";
  }

  startButton.textContent = "PLAY AGAIN";
}

holes.forEach((hole, index) => {
  hole.addEventListener("pointerdown", () => {
    if (!playing || index !== active) return;

    score += 10;
    scoreDisplay.textContent = score;

    hole.textContent = "💥";
    hole.classList.remove("zombie");
    active = -1;
  });
});

startButton.addEventListener("click", () => {
  if (!playing) startGame();
});
</script>

</body>
</html>
